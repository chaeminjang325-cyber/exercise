<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포즈 인식 장애물 달리기 게임</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- TensorFlow.js 및 Teachable Machine Pose 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8.3/dist/teachablemachine-pose.min.js"></script>
    <!-- FontAwesome 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        body {
            font-family: 'Jua', sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
        }
        canvas {
            image-rendering: pixelated;
        }
        /* Glassmorphism 효과 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="min-h-screen text-white flex flex-col items-center justify-center p-4 select-none">

    <!-- 메인 컨테이너 -->
    <div class="max-w-5xl w-full flex flex-col gap-4">
        
        <!-- 헤더 / 제목 -->
        <header class="text-center py-2 glass-panel rounded-2xl shadow-xl">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-pink-400 to-cyan-300">
                🏃‍♂️ AI 포즈 장애물 달리기
            </h1>
            <p class="text-xs sm:text-sm text-slate-300 mt-1">
                오른손 들기: <span class="text-yellow-300 font-bold">점프</span> | 왼손 들기: <span class="text-cyan-300 font-bold">숙이기</span>
            </p>
        </header>

        <!-- 대시보드 (점수 & 인식 상태) -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div class="glass-panel p-3 rounded-xl flex flex-col items-center justify-center">
                <span class="text-xs text-slate-300">현재 점수</span>
                <span id="scoreText" class="text-2xl font-black text-yellow-400">0</span>
            </div>
            <div class="glass-panel p-3 rounded-xl flex flex-col items-center justify-center">
                <span class="text-xs text-slate-300">최고 점수</span>
                <span id="highScoreText" class="text-2xl font-black text-amber-300">0</span>
            </div>
            <div class="glass-panel p-3 rounded-xl flex flex-col items-center justify-center">
                <span class="text-xs text-slate-300">인식된 포즈</span>
                <span id="detectedPoseText" class="text-xl font-bold text-emerald-400">LOADING...</span>
            </div>
            <div class="glass-panel p-3 rounded-xl flex flex-col items-center justify-center">
                <span class="text-xs text-slate-300">달리기 속도</span>
                <span id="speedText" class="text-xl font-bold text-cyan-400">1.0x</span>
            </div>
        </div>

        <!-- 메인 콘텐츠 영역 (게임 화면 + 웹캠) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-start">
            
            <!-- 게임 캔버스 영역 (2개 컬럼 차지) -->
            <div class="md:col-span-2 relative glass-panel rounded-2xl p-2 shadow-2xl overflow-hidden flex flex-col items-center">
                <canvas id="gameCanvas" width="600" height="350" class="w-full h-auto max-h-[350px] bg-slate-900 rounded-xl border border-slate-700 shadow-inner"></canvas>
                
                <!-- 게임 오버 / 시작 안내 오버레이 -->
                <div id="overlayScreen" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center gap-4 transition-all duration-300">
                    <div id="overlayContent" class="text-center p-6 rounded-2xl">
                        <div id="overlayIcon" class="text-6xl mb-3 animate-bounce">🏃‍♂️</div>
                        <h2 id="overlayTitle" class="text-3xl font-black text-yellow-300 mb-2">웹캠을 준비 중입니다...</h2>
                        <p id="overlaySub" class="text-sm text-slate-300 mb-4">카메라 권한을 허용해 주세요.</p>
                        <button id="startBtn" onclick="restartGame()" class="hidden px-8 py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 font-extrabold text-lg text-white rounded-full shadow-lg transform active:scale-95 transition-all cursor-pointer">
                            <i class="fa-solid fa-play mr-2"></i> 게임 시작하기
                        </button>
                    </div>
                </div>
            </div>

            <!-- 웹캠 및 동작 가이드 (1개 컬럼 차지) -->
            <div class="flex flex-col gap-3">
                <!-- 웹캠 화면 -->
                <div class="glass-panel p-2 rounded-2xl flex flex-col items-center">
                    <div class="w-full aspect-video bg-black/50 rounded-xl overflow-hidden relative flex items-center justify-center">
                        <canvas id="webcamCanvas" class="w-full h-full object-cover transform -scale-x-100"></canvas>
                        <span id="camStatus" class="absolute text-xs text-slate-400 bg-black/60 px-2 py-1 rounded-full top-2 left-2">
                            <i class="fa-solid fa-camera mr-1"></i> 웹캠 연동 중
                        </span>
                    </div>
                </div>

                <!-- 동작 가이드 & 확률 그래프 -->
                <div class="glass-panel p-4 rounded-2xl flex flex-col gap-2">
                    <h3 class="text-sm font-bold text-slate-200 border-b border-slate-600 pb-1 mb-1">
                        <i class="fa-solid fa-person-running mr-1"></i> 포즈 인식 확률
                    </h3>
                    
                    <!-- REST -->
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-slate-300">REST (기본 달리기)</span>
                            <span id="prob-rest" class="font-bold text-slate-400">0%</span>
                        </div>
                        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                            <div id="bar-rest" class="bg-slate-400 h-full w-0 transition-all duration-100"></div>
                        </div>
                    </div>

                    <!-- LEFT HAND (숙이기) -->
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-cyan-300">LEFT HAND (공중 피하기)</span>
                            <span id="prob-left" class="font-bold text-cyan-400">0%</span>
                        </div>
                        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                            <div id="bar-left" class="bg-cyan-400 h-full w-0 transition-all duration-100"></div>
                        </div>
                    </div>

                    <!-- RIGHT HAND (점프) -->
                    <div>
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-yellow-300">RIGHT HAND (바닥 점프)</span>
                            <span id="prob-right" class="font-bold text-yellow-400">0%</span>
                        </div>
                        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                            <div id="bar-right" class="bg-yellow-400 h-full w-0 transition-all duration-100"></div>
                        </div>
                    </div>
                </div>

                <!-- 키보드 테스트 조작 안내 -->
                <div class="text-center text-xs text-slate-400 glass-panel p-2 rounded-xl">
                    💡 테스트용 키보드: <span class="text-white font-bold">[Space]</span> 점프 / <span class="text-white font-bold">[↓]</span> 숙이기
                </div>
            </div>
        </div>
    </div>

    <script>
        // Teachable Machine Pose 모델 설정
        const MODEL_URL = "https://teachablemachine.withgoogle.com/models/7zpacVXQI/";
        let model, webcam, ctxWebcam, maxPredictions;

        // 게임 캔버스 설정
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 게임 상태 변수
        let isGameRunning = false;
        let score = 0;
        let highScore = localStorage.getItem('poseRunner_highScore') || 0;
        let gameSpeed = 4;
        let animationFrameId;
        let obstacleTimer = 0;
        let currentPose = 'REST';

        // 최고 점수 초기화 표시
        document.getElementById('highScoreText').innerText = Math.floor(highScore);

        // 플레이어 객체 설정
        const player = {
            x: 80,
            y: 220,
            width: 45,
            height: 70,
            baseY: 220,
            velocityY: 0,
            gravity: 0.8,
            isJumping: false,
            isDuck: false,
            color: '#38bdf8',

            jump() {
                if (!this.isJumping && !this.isDuck) {
                    this.isJumping = true;
                    this.velocityY = -15;
                }
            },

            duck(shouldDuck) {
                if (this.isJumping) return;
                
                if (shouldDuck) {
                    if (!this.isDuck) {
                        this.isDuck = true;
                        this.height = 35;
                        this.y = this.baseY + 35;
                    }
                } else {
                    if (this.isDuck) {
                        this.isDuck = false;
                        this.height = 70;
                        this.y = this.baseY;
                    }
                }
            },

            update() {
                // 점프 물리
                if (this.isJumping) {
                    this.y += this.velocityY;
                    this.velocityY += this.gravity;

                    if (this.y >= this.baseY) {
                        this.y = this.baseY;
                        this.isJumping = false;
                        this.velocityY = 0;
                    }
                }
            },

            draw() {
                ctx.save();
                // 캐릭터 그림자
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.beginPath();
                ctx.ellipse(this.x + this.width / 2, this.baseY + 70, this.width / 1.5, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                // 캐릭터 본체 (숙이기 상태 visual 구분)
                if (this.isDuck) {
                    ctx.fillStyle = '#06b6d4'; // 숙일 때 더 진한 청록색
                    ctx.beginPath();
                    ctx.roundRect(this.x, this.y, this.width + 10, this.height, 10);
                    ctx.fill();
                    
                    // 캐릭터 눈 (숙이기)
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(this.x + this.width - 5, this.y + 10, 8, 8);
                } else {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.roundRect(this.x, this.y, this.width, this.height, 12);
                    ctx.fill();

                    // 캐릭터 눈 (달리기/점프)
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(this.x + this.width - 15, this.y + 12, 10, 10);
                    ctx.fillStyle = '#0f172a';
                    ctx.fillRect(this.x + this.width - 10, this.y + 14, 5, 5);
                }
                ctx.restore();
            }
        };

        // 장애물 배열
        let obstacles = [];

        class Obstacle {
            constructor(type) {
                this.type = type; // 'ground' (바닥 장애물) 또는 'air' (공중 장애물)
                this.x = canvas.width + 50;
                
                if (this.type === 'ground') {
                    this.width = 35 + Math.random() * 15;
                    this.height = 45 + Math.random() * 15;
                    this.y = player.baseY + 70 - this.height; // 바닥 밀착
                    this.color = '#ef4444'; // 빨간색
                } else { // air
                    this.width = 50 + Math.random() * 20;
                    this.height = 35;
                    this.y = player.baseY - 10; // 플레이어 머리 높이
                    this.color = '#f59e0b'; // 주황색
                }
            }

            update() {
                this.x -= gameSpeed;
            }

            draw() {
                ctx.save();
                ctx.fillStyle = this.color;
                
                if (this.type === 'ground') {
                    // 가시 형태 장애물
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y + this.height);
                    ctx.lineTo(this.x + this.width / 2, this.y);
                    ctx.lineTo(this.x + this.width, this.y + this.height);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    // 공중 날아오는 장애물 (둥근 형태)
                    ctx.beginPath();
                    ctx.roundRect(this.x, this.y, this.width, this.height, 8);
                    ctx.fill();
                    
                    // 내부에 경고 아이콘 느낌의 라인
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(this.x + 5, this.y + this.height/2);
                    ctx.lineTo(this.x + this.width - 5, this.y + this.height/2);
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        // 배경 드로잉 (원근감 패럴랙스 효과)
        let bgOffset = 0;
        function drawBackground() {
            // 하늘/배경 그라데이션
            const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, '#0f172a');
            bgGrad.addColorStop(1, '#1e293b');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 멀리 있는 그리드/달리는 선 효과
            bgOffset = (bgOffset + gameSpeed * 0.5) % 40;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 2;
            for (let x = -bgOffset; x < canvas.width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            // 바닥 지면 (Ground)
            ctx.fillStyle = '#334155';
            ctx.fillRect(0, player.baseY + 70, canvas.width, canvas.height - (player.baseY + 70));

            // 지면 상단 라인
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, player.baseY + 70);
            ctx.lineTo(canvas.width, player.baseY + 70);
            ctx.stroke();
        }

        // 충돌 감지 함수 (AABB)
        function checkCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y
            );
        }

        // 초기화 및 모델 로드
        async function initAI() {
            const modelURL = MODEL_URL + "model.json";
            const metadataURL = MODEL_URL + "metadata.json";

            try {
                // 포즈 모델 불러오기
                model = await tmPose.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                // 웹캠 설정 (200x200)
                const size = 200;
                const flip = true;
                webcam = new tmPose.Webcam(size, size, flip);
                await webcam.setup();
                await webcam.play();

                const webcamCanvasElem = document.getElementById('webcamCanvas');
                webcamCanvasElem.width = size;
                webcamCanvasElem.height = size;
                ctxWebcam = webcamCanvasElem.getContext('2d');

                // 카메라 연결 완료 후 UI 업데이트
                document.getElementById('camStatus').innerHTML = '<i class="fa-solid fa-video text-emerald-400 mr-1"></i> 웹캠 작동 중';
                document.getElementById('overlayTitle').innerText = "준비 완료!";
                document.getElementById('overlaySub').innerText = "카메라 앞에서 동작을 취해 시작하거나 아래 버튼을 누르세요.";
                document.getElementById('startBtn').classList.remove('hidden');

                // 예측 루프 시작
                window.requestAnimationFrame(loopAI);
            } catch (err) {
                console.error("AI 모델/웹캠 로딩 실패:", err);
                document.getElementById('overlayTitle').innerText = "카메라를 불러올 수 없습니다";
                document.getElementById('overlaySub').innerText = "웹캠 권한을 허용했는지 확인해 주세요. (키보드로 플레이 가능)";
                document.getElementById('startBtn').classList.remove('hidden');
            }
        }

        // AI 예측 루프
        async function loopAI() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loopAI);
        }

        // 포즈 예측 및 게임 캐릭터 연동
        async function predict() {
            const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
            const prediction = await model.predict(posenetOutput);

            let topClass = "";
            let topProb = 0;

            for (let i = 0; i < maxPredictions; i++) {
                const className = prediction[i].className;
                const probability = prediction[i].probability;

                // 확률 프로그레스 바 UI 업데이트
                if (className === 'REST') {
                    updateProbUI('rest', probability);
                } else if (className === 'LEFT HAND') {
                    updateProbUI('left', probability);
                } else if (className === 'RIGHT HAND') {
                    updateProbUI('right', probability);
                }

                if (probability > topProb) {
                    topProb = probability;
                    topClass = className;
                }
            }

            currentPose = topClass;
            document.getElementById('detectedPoseText').innerText = currentPose;

            // 웹캠 Canvas에 스켈레톤 드로잉
            if (ctxWebcam) {
                ctxWebcam.drawImage(webcam.canvas, 0, 0);
                if (pose) {
                    const minPartConfidence = 0.5;
                    tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctxWebcam);
                    tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctxWebcam);
                }
            }

            // 동작 제어 (확률 75% 이상일 때 동작)
            if (topProb > 0.75) {
                if (currentPose === 'RIGHT HAND') {
                    player.duck(false);
                    player.jump();
                } else if (currentPose === 'LEFT HAND') {
                    player.duck(true);
                } else if (currentPose === 'REST') {
                    player.duck(false);
                }
            }
        }

        function updateProbUI(type, prob) {
            const percent = Math.round(prob * 100);
            document.getElementById(`prob-${type}`).innerText = `${percent}%`;
            document.getElementById(`bar-${type}`).style.width = `${percent}%`;
        }

        // 게임 메인 루프
        function gameLoop() {
            if (!isGameRunning) return;

            // 1. 화면 초기화 및 배경
            drawBackground();

            // 2. 점수 및 난이도(속도) 상승
            score += 0.1;
            gameSpeed = 4 + Math.floor(score / 150) * 0.5; // 지속해서 속도 상승
            
            document.getElementById('scoreText').innerText = Math.floor(score);
            document.getElementById('speedText').innerText = (gameSpeed / 4).toFixed(1) + 'x';

            // 3. 플레이어 업데이트 & 드로잉
            player.update();
            player.draw();

            // 4. 장애물 생성
            obstacleTimer++;
            const spawnInterval = Math.max(60, 120 - Math.floor(gameSpeed * 5)); // 속도가 빠를수록 자주 등장
            if (obstacleTimer > spawnInterval) {
                const type = Math.random() < 0.5 ? 'ground' : 'air';
                obstacles.push(new Obstacle(type));
                obstacleTimer = 0;
            }

            // 5. 장애물 이동 및 충돌 체크
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.update();
                obs.draw();

                // 충돌 처리
                if (checkCollision(player, obs)) {
                    gameOver();
                    return;
                }

                // 화면 밖으로 나간 장애물 제거
                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // 게임 시작 / 재시작
        function restartGame() {
            score = 0;
            gameSpeed = 4;
            obstacles = [];
            obstacleTimer = 0;
            isGameRunning = true;

            document.getElementById('overlayScreen').classList.add('hidden');

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        // 게임 오버
        function gameOver() {
            isGameRunning = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('poseRunner_highScore', highScore);
                document.getElementById('highScoreText').innerText = Math.floor(highScore);
            }

            document.getElementById('overlayIcon').innerText = '💥';
            document.getElementById('overlayTitle').innerText = '게임 오버!';
            document.getElementById('overlaySub').innerText = `최종 점수: ${Math.floor(score)}점`;
            document.getElementById('startBtn').innerText = '다시 도전하기';
            document.getElementById('overlayScreen').classList.remove('hidden');
        }

        // 키보드 테스트 조작 이벤트
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                player.duck(false);
                player.jump();
            } else if (e.code === 'ArrowDown') {
                player.duck(true);
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowDown') {
                player.duck(false);
            }
        });

        // 초기 시작
        window.onload = () => {
            drawBackground();
            player.draw();
            initAI();
        };
    </script>
</body>
</html>
